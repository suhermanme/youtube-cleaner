[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youtube-cleaner"
version = "0.1.0"
description = "Safety-first local YouTube library cleanup through the visible web UI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "playwright>=1.55,<2",
  "pydantic>=2.11,<3",
  "pyside6-essentials>=6.8,<7",
  "rich>=14,<15",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "pytest-cov>=6,<8"]

[project.scripts]
youtube-cleaner = "youtube_cleaner.cli:app"
youtube-cleaner-gui = "youtube_cleaner.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_cleaner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: optional local-browser tests (set YOUTUBE_CLEANER_INTEGRATION=1)"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-cov>=6,<8"]
